<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Emotion Detector</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 60px auto; padding: 0 20px; }
    h1 { color: #333; }
    textarea { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
    button { margin-top: 10px; padding: 10px 24px; background: #0062ff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #0043cb; }
    #system_response { margin-top: 20px; padding: 14px; background: #f4f4f4; border-radius: 4px; font-size: 14px; min-height: 40px; }
  </style>
</head>
<body>
  <h1>Emotion Detector</h1>
  <p>Enter a statement and click <strong>Run Sentiment Analysis</strong> to detect emotions.</p>
  <textarea id="textToAnalyse" rows="5" placeholder="Type your text here..."></textarea>
  <br/>
  <button onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
  <div id="system_response">Your results will appear here.</div>
  <script src="/static/mywebscript.js"></script>
</body>
</html>
